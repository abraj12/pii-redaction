version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: pii_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  pii-engine:
    build:
      context: ./pii-engine
      dockerfile: Dockerfile
    container_name: pii_engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pii_backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - pii-engine
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/pii-redaction
      - JWT_SECRET=super_secret_jwt_key_here
      - PII_ENGINE_URL=http://pii-engine:8000
      - PORT=5000

volumes:
  mongodb_data:
